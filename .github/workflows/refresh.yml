name: Refresh Lifts data

on:
  schedule:
    # Four times a day. The live outage feed is the only fast-moving input.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install shapely

      - name: Fetch MTA data
        run: python3 scripts/fetch.py

      - name: Build site payload
        run: python3 scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Refresh elevator data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
